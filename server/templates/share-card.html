<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }}的微信名片</title>
  <meta property="og:title" content="{{ name }}的微信名片">
  <meta property="og:description" content="{{ title }}{{ ' | ' + phone if phone else '' }}">
  <meta property="og:image" content="{{ share_image_url }}">
  <meta property="og:type" content="website">
  <meta itemprop="name" content="{{ name }}的微信名片">
  <meta itemprop="description" content="{{ title }}{{ ' | ' + phone if phone else '' }}">
  <meta itemprop="image" content="{{ share_image_url }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .share-card {
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #4a90d9 0%, #6ba3d6 25%, #d4a853 75%, #c4943a 100%);
      padding: 30px 24px 24px;
      position: relative;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-circle img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .card-header-text {
      flex: 1;
    }
    .card-name {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
    }
    .card-phone {
      font-size: 18px;
      color: rgba(255,255,255,0.95);
      text-align: center;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .card-info {
      text-align: center;
    }
    .card-title {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
    }
    .card-title2 {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
    }
    .card-email {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }
    .card-buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .card-btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }
    .btn-recommend { background: #5b8fd9; }
    .btn-save { background: #5b8fd9; }
    .btn-call { background: #5b8fd9; }
  </style>
</head>
<body>
  <div class="share-card">
    <div class="card-header">
      <div class="logo-circle">
        {% if logo_url %}
        <img src="{{ logo_url }}" alt="logo">
        {% endif %}
      </div>
    </div>
    <div class="card-name">{{ name }}</div>
    {% if phone %}
    <div class="card-phone">{{ phone }}</div>
    {% endif %}
    <div class="card-info">
      {% if title %}
      <div class="card-title">{{ title }}</div>
      {% endif %}
      {% if title2 %}
      <div class="card-title2">{{ title2 }}</div>
      {% endif %}
      {% if email %}
      <div class="card-email">邮箱：{{ email }}</div>
      {% endif %}
    </div>
    <div class="card-buttons">
      <div class="card-btn btn-recommend">推荐给TA</div>
      <div class="card-btn btn-save">保存到手机</div>
      <div class="card-btn btn-call">一键拨号</div>
    </div>
  </div>
</body>
</html>
