<script>
// 纯前端过滤：卡片全是静态的，搜索不产生任何 Worker 调用，不消耗 Cloudflare 额度
(function () {
  var input = document.getElementById('q');
  if (!input) return;
  var groups = Array.prototype.slice.call(document.querySelectorAll('.group'));
  var all = groups.map(function (g) {
    return { el: g, items: Array.prototype.slice.call(g.querySelectorAll('.item')) };
  });
  input.addEventListener('input', function () {
    var kw = input.value.trim().toLowerCase();
    all.forEach(function (g) {
      var hit = 0;
      g.items.forEach(function (it) {
        var show = !kw || (it.dataset.name || '').toLowerCase().indexOf(kw) !== -1;
        it.style.display = show ? '' : 'none';
        if (show) hit++;
      });
      g.el.style.display = hit ? '' : 'none';
    });
  });
})();
</script>
