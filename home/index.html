<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f8 0%, #f7f9fc 40%, #eef2f8 100%);
    min-height:100vh; color:#0f172a; padding-bottom:40px;
    /* 长英文/URL 不撑破容器；与下面各处的 break-word 一起防溢出 */
    overflow-wrap:break-word; word-break:break-word;
  }
  img, svg, a { max-width:100%; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 20px; }

  /* ---------- 顶部 ---------- */
  .hero {
    position:relative; overflow:hidden; margin:0 -20px 26px; padding:48px 32px 40px;
    background:
      radial-gradient(60vw 40vh at 12% 0%, rgba(38,198,218,.30), transparent 62%),
      radial-gradient(52vw 38vh at 88% 8%, rgba(124,77,255,.26), transparent 62%),
      radial-gradient(46vw 36vh at 70% 100%, rgba(68,138,255,.22), transparent 62%),
      linear-gradient(135deg,#0e7490 0%, #1d4ed8 55%, #5b21b6 100%);
    color:#fff;
  }
  .hero::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:34px 34px;
  }
  .hero > * { position:relative; z-index:1; }
  /* logo 靠右，文字与统计靠左 */
  .hero-inner { display:flex; align-items:flex-start; justify-content:space-between; gap:28px; }
  .hero-main { flex:1; min-width:0; }
  .hero-logo { flex-shrink:0; }
  .hero-logo img {
    width:184px; height:184px; border-radius:50%; object-fit:cover;
    border:3px solid rgba(255,255,255,.38);
    box-shadow:0 10px 30px rgba(0,0,0,.30), 0 0 0 6px rgba(255,255,255,.10);
  }
  .hero .badge {
    display:inline-block; padding:5px 13px; border-radius:20px; font-size:12px;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28);
    letter-spacing:1px; margin-bottom:14px;
  }
  .hero h1 { font-size:30px; font-weight:800; letter-spacing:.5px; line-height:1.3;
    /* 长标题在窄屏自动折行，不撑破容器 */
    overflow-wrap:break-word; word-break:break-word; }
  .hero .sub { margin-top:12px; font-size:15px; line-height:1.75; opacity:.9; max-width:720px; }
  .hero .who { margin-top:16px; font-size:14px; opacity:.92; }
  .hero .who b { font-weight:700; margin-right:8px; }

  /* ---------- 页脚联系方式 ---------- */
  .pagefoot { margin-top:26px; text-align:center; }
  .pagefoot .contact {
    display:inline-block; max-width:100%; padding:10px 20px;
    font-size:14px; line-height:1.6; color:#0e7490; font-weight:500;
    background:#fff; border:1px solid rgba(14,116,144,.28);
    border-radius:24px; box-shadow:0 4px 16px rgba(15,23,42,.07);
    /* 窄屏折行，不撑破容器 */
    overflow-wrap:break-word; word-break:break-word;
  }
  .pagefoot .contact a { color:#0e7490; font-weight:700; text-decoration:none;
                         border-bottom:1px solid rgba(14,116,144,.45); }
  .pagefoot .contact a:hover { border-bottom-color:#0e7490; }

  /* ---------- 分组 ---------- */
  .group { margin-bottom:26px; background:#fff; border-radius:20px;
    box-shadow:0 10px 34px rgba(15,23,42,.08); overflow:hidden; }
  .group > h2 {
    padding:16px 22px; font-size:16px; font-weight:700; color:#0f172a;
    border-bottom:1px solid #eef2f6; display:flex; align-items:center; gap:10px;
    background:linear-gradient(90deg, rgba(14,116,144,.06), transparent 70%);
    /* 长分组名折行而不是溢出；计数用 flex-shrink 固定在右侧 */
    overflow-wrap:break-word; word-break:break-word;
  }
  .group > h2 .n { margin-left:auto; font-size:12px; font-weight:500; color:#94a3b8;
                   flex-shrink:0; padding-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:13px; padding:18px; }
  .item {
    display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
    background:#fff; border:1px solid #e8eef5; border-radius:15px; padding:13px 15px;
    transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s, border-color .22s;
  }
  .item:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(15,23,42,.15); border-color:#26c6da; }
  .item .av {
    flex-shrink:0; width:42px; height:42px; border-radius:50%; object-fit:cover;
    background:#e2e8f0; border:1px solid rgba(15,23,42,.06);
  }
  .item .av.ph { display:flex; align-items:center; justify-content:center;
                 color:#fff; font-weight:700; font-size:16px; border:none; }
  .item .info { min-width:0; flex:1; }
  .item .nm { font-weight:650; font-size:15px; line-height:1.35; color:#0f172a;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .ti { font-size:12px; color:#64748b; line-height:1.5; margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .empty { padding:70px 24px; text-align:center; color:#94a3b8; font-size:14px; line-height:2; }

  @media (max-width:640px) {
    .hero { padding:36px 20px 30px; margin:0 -20px 20px; }
    .hero-inner { gap:16px; flex-wrap:wrap; }
    /* 放大后手机横排放不下，logo 移到上方右对齐，标题独占一行 */
    .hero-logo { order:-1; margin-left:auto; }
    .hero-logo img { width:120px; height:120px; box-shadow:0 6px 18px rgba(0,0,0,.28), 0 0 0 4px rgba(255,255,255,.10); }
    .hero-main { width:100%; }
    .hero h1 { font-size:22px; line-height:1.35; }
    .hero .who { font-size:13px; margin-top:12px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; padding:13px; }
    .item { padding:12px; gap:10px; }
    .item .av { width:36px; height:36px; }
    .item .av.ph { font-size:14px; }
    .item .nm { font-size:14px; }
    .item .ti { font-size:11px; }
    .group > h2 { padding:14px 16px; font-size:15px; }
    .pagefoot { margin-top:20px; }
    .pagefoot .contact { font-size:13px; padding:9px 16px; }
  }

  /* 极窄屏（<=380px）：再收一档，杜绝任何横向溢出 */
  @media (max-width:380px) {
    .wrap { padding:0 14px; }
    .hero { padding:28px 16px 24px; margin:0 -14px 16px; }
    .hero-logo img { width:96px; height:96px; }
    .hero h1 { font-size:19px; }
    .grid { grid-template-columns:1fr 1fr; gap:9px; padding:11px; }
    .item { padding:11px; }
    .pagefoot .contact { font-size:12.5px; padding:8px 13px; }
  }
</style>
