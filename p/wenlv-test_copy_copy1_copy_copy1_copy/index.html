  <script>
    // 页面管理功能
    (function() {
      let currentPageId = null;
      let groups = [];
      let clickCount = 0;
      let clickTimer = null;

      // 从URL获取页面ID
      const urlParams = new URLSearchParams(window.location.search);
      currentPageId = urlParams.get('page') || 'home';

      // 彩蛋：连续点击右下角5次显示管理按钮
      document.getElementById('adminTrigger').addEventListener('click', function() {
        clickCount++;
        clearTimeout(clickTimer);
        
        if (clickCount >= 5) {
          clickCount = 0;
          document.getElementById('openAdminPanel').style.display = 'block';
          // 显示提示
          const toast = document.createElement('div');
          toast.style.cssText = 'position:fixed;bottom:80px;right:20px;background:rgba(0,0,0,0.7);color:white;padding:10px 20px;border-radius:8px;font-size:14px;z-index:10000;';
          toast.textContent = '已显示管理入口';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 2000);
        } else {
          clickTimer = setTimeout(() => clickCount = 0, 2000);
        }
      });

      // 打开管理面板
      document.getElementById('openAdminPanel').addEventListener('click', openAdminPanel);
      document.getElementById('closeAdminPanel').addEventListener('click', closeAdminPanel);
      document.getElementById('cancelAdminPanel').addEventListener('click', closeAdminPanel);
      document.getElementById('pageAdminPanel').addEventListener('click', function(e) {
        if (e.target === this) closeAdminPanel();
      });

      // 表单提交
      document.getElementById('pageAdminForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        await savePageSettings();
      });

      async function openAdminPanel() {
        const panel = document.getElementById('pageAdminPanel');
        panel.style.display = 'flex';

        // 加载分组
        await loadGroups();

        // 加载当前页面信息
        document.getElementById('adminPageId').value = currentPageId;
        
        // 从配置中获取页面信息
        if (window.DynamicConfig && DynamicConfig.config) {
          const page = DynamicConfig.config.currentPage || {};
          document.getElementById('adminPageTitle').value = page.title || '';
          document.getElementById('adminShareTitle').value = page.share_title || '';
          document.getElementById('adminShareDesc').value = page.share_desc || '';
          
          // 设置分组
          const groupSelect = document.getElementById('adminPageGroup');
          for (let option of groupSelect.options) {
            if (option.value === (page.groupId || 'default')) {
              option.selected = true;
              break;
            }
          }
        }
      }

      function closeAdminPanel() {
        document.getElementById('pageAdminPanel').style.display = 'none';
        document.getElementById('adminMessage').style.display = 'none';
      }

      async function loadGroups() {
        try {
          const response = await fetch('/api/groups');
          const data = await response.json();
          groups = data.groups || [];
          
          const select = document.getElementById('adminPageGroup');
          select.innerHTML = '';
          groups.forEach(group => {
            const option = document.createElement('option');
            option.value = group.id;
            option.textContent = group.name;
            select.appendChild(option);
          });
        } catch (error) {
          console.error('加载分组失败:', error);
        }
      }

      async function savePageSettings() {
        const messageEl = document.getElementById('adminMessage');
        
        try {
          const response = await fetch('/api/update-page', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              pageId: currentPageId,
              title: document.getElementById('adminPageTitle').value,
              groupId: document.getElementById('adminPageGroup').value,
              share_title: document.getElementById('adminShareTitle').value,
              share_desc: document.getElementById('adminShareDesc').value
            })
          });

          const result = await response.json();
          
          if (result.success) {
            messageEl.textContent = '保存成功!';
            messageEl.style.background = '#d4edda';
            messageEl.style.color = '#155724';
            messageEl.style.display = 'block';
            
            // 更新页面标题
            if (DynamicConfig && DynamicConfig.config) {
              if (!DynamicConfig.config.currentPage) {
                DynamicConfig.config.currentPage = {};
              }
              DynamicConfig.config.currentPage.title = document.getElementById('adminPageTitle').value;
              DynamicConfig.config.currentPage.groupId = document.getElementById('adminPageGroup').value;
              DynamicConfig.config.currentPage.share_title = document.getElementById('adminShareTitle').value;
              DynamicConfig.config.currentPage.share_desc = document.getElementById('adminShareDesc').value;
            }
            
            setTimeout(closeAdminPanel, 1500);
          } else {
            throw new Error(result.error || '保存失败');
          }
        } catch (error) {
          messageEl.textContent = error.message;
          messageEl.style.background = '#f8d7da';
          messageEl.style.color = '#721c24';
          messageEl.style.display = 'block';
        }
      }
    })();
  </script>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let isDev = urlParams.get('dev') === '1' || window.location.hash.includes('dev');

      function applyDevMode() {
        const bar = document.getElementById('devBar');
        if (isDev) {
          document.body.classList.add('dev-mode');
          if (bar) bar.style.display = 'flex';
        } else {
          document.body.classList.remove('dev-mode');
          if (bar) bar.style.display = 'none';
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        applyDevMode();
        const btn = document.getElementById('toggleDevBtn');
        if (btn) {
          btn.addEventListener('click', () => {
            isDev = !isDev;
            const url = new URL(window.location);
            if (isDev) url.searchParams.set('dev', '1');
            else url.searchParams.delete('dev');
            window.history.replaceState({}, '', url);
            applyDevMode();
            window.location.reload();
          });
        }

        // Delegate clicks on clickable resources in dev mode
        document.body.addEventListener('click', (e) => {
          if (!isDev) return;
          const target = e.target.closest('.clickable-resource');
          if (target) {
            e.preventDefault();
            e.stopPropagation();
            const resUrl = target.getAttribute('data-res-url') || target.src || target.style.backgroundImage;
            let cleanUrl = resUrl;
            if (cleanUrl.startsWith('url(')) {
              cleanUrl = cleanUrl.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
            }
            if (cleanUrl) {
              document.getElementById('modalResUrl').textContent = cleanUrl;
              document.getElementById('modalLinkInput').value = cleanUrl;
              document.getElementById('replaceModal').style.display = 'flex';
            }
          }
        }, true);
      });

      window.closeDevModal = function() {
        document.getElementById('replaceModal').style.display = 'none';
        document.getElementById('modalStatus').style.display = 'none';
        document.getElementById('modalForm').reset();
      };

      document.getElementById('modalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('modalStatus');
        statusDiv.style.display = 'block';
        statusDiv.style.color = '#374151';
        statusDiv.textContent = '正在上传并替换资源...';

        try {
          const resp = await fetch('/api/resource/replace', {
            method: 'POST',
            body: formData
          });
          const data = await resp.json();
          // 兼容新旧两种返回格式（{code:0,...} 或 {success:true,...}）
          if (data.code === 0 || data.success === true) {
            statusDiv.style.color = '#059669';
            const verb = data.action === '新增' ? '上传' : '替换';
            statusDiv.textContent = `${verb}成功！正在刷新页面...`;
            setTimeout(() => window.location.reload(), 1000);
          } else {
            throw new Error(data.error || data.msg || '替换失败');
          }
        } catch (err) {
          statusDiv.style.color = '#dc2626';
          statusDiv.textContent = err.message;
        }
      });
    })();
  </script>
