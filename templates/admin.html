<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信名片 - 分组管理</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .group-item {
            cursor: grab;
            transition: all 0.2s;
        }
        .group-item:active {
            cursor: grabbing;
        }
        .group-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
        }
        .group-item.drag-over {
            border: 2px dashed #3b82f6;
            background: #eff6ff;
        }
        .group-item.active {
            background: #eff6ff;
            border-color: #3b82f6;
        }
        .preview-link {
            transition: all 0.2s;
        }
        .preview-link:hover {
            transform: translateX(4px);
        }
        .component-card {
            scroll-margin-top: 20px;
        }
        .sidebar {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .main-content {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto py-8 px-4">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">📱 微信名片分组管理</h1>
                    <p class="text-sm text-gray-500 mt-1">点击左侧分组，右侧自动滚动到对应位置</p>
                </div>
                <div class="space-x-2">
                    <a href="/" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 text-sm">返回预览</a>
                    <a href="/admin/resource-replace" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 text-sm">资源替换</a>
                </div>
            </div>
        </div>

        <!-- Two Column Layout -->
        <div class="flex gap-6">
            <!-- Left Sidebar - Group List -->
            <div class="w-80 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">分组列表</h2>
                    <div id="groupsContainer" class="space-y-2 sidebar">
                        <!-- Groups will be rendered here -->
                    </div>
                    
                    <div class="mt-4 pt-4 border-t">
                        <button id="addGroupBtn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">
                            + 添加新分组
                        </button>
                        <button id="saveBtn" class="w-full bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm mt-2">
                            保存排序
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Content - Component Preview -->
            <div class="flex-1">
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">组件预览（点击左侧分组自动定位）</h2>
                    <div id="componentsContainer" class="space-y-4 main-content">
                        <p class="text-gray-500 text-center py-8">请选择左侧分组查看组件</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Group Modal -->
        <div id="addModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <h3 class="text-lg font-bold mb-4">添加新分组</h3>
                <form id="addForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">分组名称</label>
                        <input type="text" id="groupName" required placeholder="例如：首页" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">分组 ID</label>
                        <input type="text" id="groupId" required placeholder="例如：home" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="closeAddModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">取消</button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">添加</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let db = {{ db | tojson }};
        let draggedItem = null;
        let activeGroupId = null;

        function renderGroups() {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = '';

            if (!db.pages || db.pages.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无分组</p>';
                return;
            }

            db.pages.forEach((page, index) => {
                const div = document.createElement('div');
                div.className = 'group-item bg-gray-50 border border-gray-200 rounded-lg p-3';
                div.draggable = true;
                div.dataset.index = index;
                div.dataset.pageId = page.id;
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 flex-1 cursor-pointer" onclick="scrollToGroup('${page.id}')">
                            <span class="text-gray-400 cursor-move text-sm" onclick="event.stopPropagation()">⋮⋮</span>
                            <div>
                                <h3 class="font-medium text-gray-800 text-sm hover:text-blue-600">${page.title}</h3>
                                <p class="text-xs text-gray-400">ID: ${page.id}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <a href="/?page=${page.id}&dev=1&token=wswwsw1234" class="text-blue-600 hover:text-blue-800 text-xs px-2 py-1">🔗</a>
                            <button onclick="event.stopPropagation(); editGroup(${index})" class="text-gray-500 hover:text-gray-700 text-xs px-2 py-1">✏️</button>
                            <button onclick="event.stopPropagation(); deleteGroup(${index})" class="text-red-500 hover:text-red-700 text-xs px-2 py-1">🗑️</button>
                        </div>
                    </div>
                `;

                // Drag events
                div.addEventListener('dragstart', (e) => {
                    draggedItem = div;
                    div.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                div.addEventListener('dragend', () => {
                    div.classList.remove('dragging');
                    draggedItem = null;
                    document.querySelectorAll('.group-item').forEach(item => {
                        item.classList.remove('drag-over');
                    });
                });

                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== div) {
                        div.classList.add('drag-over');
                    }
                });

                div.addEventListener('dragleave', () => {
                    div.classList.remove('drag-over');
                });

                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    if (draggedItem && draggedItem !== div) {
                        const fromIndex = parseInt(draggedItem.dataset.index);
                        const toIndex = parseInt(div.dataset.index);
                        const item = db.pages.splice(fromIndex, 1)[0];
                        db.pages.splice(toIndex, 0, item);
                        renderGroups();
                        renderComponents(activeGroupId);
                    }
                });

                container.appendChild(div);
            });
        }

        function renderComponents(pageId) {
            const container = document.getElementById('componentsContainer');
            activeGroupId = pageId;

            // Update active state in sidebar
            document.querySelectorAll('.group-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.pageId === pageId) {
                    item.classList.add('active');
                }
            });

            // Find components for this page
            const pageComponents = db.components ? db.components.filter(c => c.pageId === pageId) : [];
            
            if (pageComponents.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">该分组暂无组件</p>';
                return;
            }

            container.innerHTML = '';
            pageComponents.forEach((comp, index) => {
                const div = document.createElement('div');
                div.className = 'component-card bg-gray-50 border border-gray-200 rounded-lg p-4';
                div.id = `comp-${comp.uid}`;
                
                const typeLabels = {
                    'contact': '👤 联系人',
                    'title': '📝 标题',
                    'text': '📄 文本',
                    'image': '🖼️ 图片',
                    'video': '🎬 视频',
                    'pdf': '📑 PDF',
                    'tabs': '📑 标签页',
                    'carousel': '🎠 轮播图',
                    'spacer': '📏 间距',
                    'mapping': '📍 地图',
                    'imageButton': '🔘 图片按钮'
                };
                
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="text-xl">${typeLabels[comp.type] || '📦 未知'}</span>
                            <div>
                                <h4 class="font-medium text-gray-800">${comp.customTitle || comp.title || comp.name || '未命名'}</h4>
                                <p class="text-xs text-gray-400">ID: ${comp.uid} | 类型: ${comp.type}</p>
                            </div>
                        </div>
                        <a href="/?page=${pageId}&dev=1&token=wswwsw1234#comp-${comp.uid}" class="text-blue-600 hover:text-blue-800 text-sm">
                            查看预览 →
                        </a>
                    </div>
                `;
                
                container.appendChild(div);
            });
        }

        function scrollToGroup(pageId) {
            // Render components for this group
            renderComponents(pageId);
            
            // Scroll components container to top
            const componentsContainer = document.getElementById('componentsContainer');
            componentsContainer.scrollTop = 0;
        }

        function editGroup(index) {
            window.location.href = `/admin/group/${db.pages[index].id}`;
        }

        function deleteGroup(index) {
            if (confirm(`确定要删除分组 "${db.pages[index].title}" 吗？`)) {
                db.pages.splice(index, 1);
                renderGroups();
                document.getElementById('componentsContainer').innerHTML = '<p class="text-gray-500 text-center py-8">请选择左侧分组查看组件</p>';
            }
        }

        document.getElementById('addGroupBtn').addEventListener('click', () => {
            document.getElementById('addModal').classList.remove('hidden');
        });

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addForm').reset();
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('groupName').value.trim();
            const id = document.getElementById('groupId').value.trim();
            
            if (!db.pages) db.pages = [];
            db.pages.push({
                id: id,
                title: name,
                sections: [],
                share_title: '',
                share_desc: ''
            });
            
            closeAddModal();
            renderGroups();
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            try {
                const resp = await fetch('/api/components', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(db)
                });
                const data = await resp.json();
                if (data.code === 0) {
                    alert('保存成功！');
                } else {
                    alert('保存失败：' + data.msg);
                }
            } catch (err) {
                alert('保存失败：' + err.message);
            }
        });

        // Initialize
        renderGroups();
    </script>
</body>
</html>
