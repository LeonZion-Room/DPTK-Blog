<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信名片 - 一键替换资源</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">📂 微信名片资源一键替换</h1>
        
        <form id="replaceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">目标资源链接 / 文件名</label>
                <input type="text" id="targetLink" name="link" required placeholder="例如 /static/assets/default_avatar.png 或 filename.png" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="button" id="checkRefBtn" class="mt-2 bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-300">检查受影响组件</button>
            </div>

            <div id="refResult" class="hidden bg-blue-50 border-l-4 border-blue-400 p-3 text-sm text-blue-700"></div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上传新文件 (同名覆盖/保持链接不变)</label>
                <input type="file" id="newFile" name="file" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>

            <div class="pt-4 flex justify-end space-x-3">
                <a href="/" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400">返回查看页</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">确认替换并生效</button>
            </div>
        </form>

        <div id="statusMsg" class="mt-4 hidden p-3 rounded text-center font-medium"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const prefillLink = urlParams.get('link');
        if (prefillLink) {
            document.getElementById('targetLink').value = prefillLink;
            checkReferences(prefillLink);
        }

        document.getElementById('checkRefBtn').addEventListener('click', () => {
            const link = document.getElementById('targetLink').value.trim();
            if (link) checkReferences(link);
        });

        async function checkReferences(link) {
            const resDiv = document.getElementById('refResult');
            resDiv.classList.remove('hidden');
            resDiv.textContent = '正在查询引用该资源的组件...';
            try {
                const resp = await fetch(`/api/resource/references?link=${encodeURIComponent(link)}`);
                const data = await resp.json();
                if (data.code === 0 && data.references.length > 0) {
                    const names = data.references.map(r => `[${r.type}] ${r.name} (uid: ${r.uid})`).join(', ');
                    resDiv.textContent = `该资源被以下组件引用：${names}`;
                } else {
                    resDiv.textContent = '未找到直接引用该资源的组件（或为全局背景/默认资源）。';
                }
            } catch (err) {
                resDiv.textContent = '查询引用失败';
            }
        }

        document.getElementById('replaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const msgDiv = document.getElementById('statusMsg');
            msgDiv.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            msgDiv.className = 'mt-4 p-3 rounded text-center font-medium bg-gray-100 text-gray-700';
            msgDiv.textContent = '正在上传并替换资源...';

            try {
                const resp = await fetch('/api/resource/replace', {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();
                if (data.code === 0) {
                    msgDiv.className = 'mt-4 p-3 rounded text-center font-medium bg-green-100 text-green-700';
                    msgDiv.textContent = `替换成功！新文件已生效: ${data.url}`;
                } else {
                    throw new Error(data.msg || '替换失败');
                }
            } catch (err) {
                msgDiv.className = 'mt-4 p-3 rounded text-center font-medium bg-red-100 text-red-700';
                msgDiv.textContent = `错误: ${err.message}`;
            }
        });
    </script>
</body>
</html>
